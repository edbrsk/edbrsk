<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Dreambudget Landing CSS -->
{{ $landingCSS := resources.Get "css/landing.css" | resources.Minify | resources.Fingerprint "sha512" }}
<link rel="stylesheet" href="{{ $landingCSS.Permalink }}" integrity="{{ $landingCSS.Data.Integrity }}">

<script src="https://cdn.tailwindcss.com"></script>

{{ if eq .Section "dreambudget" }}
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
{{ $dreambudgetCSS := resources.Get "css/dreambudget.css" | resources.Minify | resources.Fingerprint "sha512" }}
<link rel="stylesheet" href="{{ $dreambudgetCSS.RelPermalink }}" integrity="{{ $dreambudgetCSS.Data.Integrity }}">
{{ end }}
